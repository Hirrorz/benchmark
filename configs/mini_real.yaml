  name: deepseek_v4_1_flash
  hidden: 5120
  moe_intermediate: 2304
  swiglu_limit: 10.0     # 官方 config.swiglu_limit（mega_moe activation_clamp）
  n_layers: 40
  n_routed_experts: 384
  n_shared_experts: 1
  topk: 6
  sliding_window: 128
  compress_ratios:
  - 0
  - 0
  - 2
