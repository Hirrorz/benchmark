# 配方段 → 容器路径映射（配置即事实源；人工可编辑）
# 新增算子/容器：在本文件加一行，不需要改 Python。
schema: ds41_mini/recipe-map@1
note: 容器展示信息与 (段,算子,出现序号)->层内路径映射；改结构只改本文件。
containers:
- path: attn
  title: Attention
  doc: 注意力块：HC → norm → q/kv → rope → cache → 压缩/索引 → 核心 → 输出投影
  order: 0
- path: attn.compressor
  title: Compressor
  doc: 压缩 KV 写入（kv_src 层）
  order: 0
- path: attn.core
  title: Attention core
  doc: mqsmla（窗口 + 压缩 MLA）
  order: 0
- path: attn.hc
  title: Hyper-connection (attn)
  doc: attn 段的 hc_pre / hc_post
  order: 0
- path: attn.indexer
  title: Indexer
  doc: 索引器（kv_src / index_src 层）
  order: 0
- path: attn.indexer.q_proj
  title: Indexer query
  doc: idx_prolog
  order: 0
- path: attn.indexer.search
  title: Sparse search
  doc: QLI / QSLI（稀疏索引）
  order: 0
- path: attn.kv_indexer
  title: Indexer K cache (KV path)
  doc: 索引 K 缓存写入（split 的 KV 路径；在 boundary_cut 之前）
  order: 0
- path: attn.kv_proj
  title: KV projection
  doc: wkv → kv_norm（+ split 视图的 kv rope）
  order: 0
- path: attn.o_proj
  title: Output projection
  doc: wo_a → wo_b
  order: 0
- path: attn.q_proj
  title: Q projection
  doc: wq_a → q_norm → wq_b（MLA 低秩）
  order: 0
- path: engram
  title: Engram
  doc: 层首 engram：hash → 取表 → 投影/gate
  order: 0
- path: ffn
  title: FFN / MoE
  doc: FFN 块：HC → norm → 路由 → 专家 → HC
  order: 0
- path: ffn.hc
  title: Hyper-connection (ffn)
  doc: ffn 段的 hc_pre / hc_post
  order: 0
- path: ffn.moe
  title: MoE
  doc: 融合 mega_moe 或未融合链
  order: 0
- path: ffn.moe.experts
  title: Experts
  doc: 专家分组 MM / SwiGLU
  order: 0
- path: ffn.moe.routing
  title: Routing
  doc: gate/topk_gate（或 gating 链）
  order: 0
- path: layer.epilogue
  title: Elementwise epilogue
  doc: 占位小算子（默认不下发）
  order: 0
