  wq_a:
    category: attention
    impl: exec_ops:_wq_a
    kernel: ''
    requires:
    - hidden.x [T,H]
    - model.hidden
    - model.q_lora_rank
    provides:
    - attn.qr [T,q_lora]
    weights:
    - attn.wq_a.weight
    - attn.wq_a.scale
    doc: MLA q 低秩投影（mxfp8 QMM）
  wq_b:
    category: attention
    impl: exec_ops:_wq_b
    kernel: ''
    params:
      head_dim: ${model.head_dim}
    requires:
    - attn.qr [T,q_lora]
    - model.q_lora_rank
    - model.head_dim
    - model.n_attention_heads
    provides:
    - attn.q [T,n_heads,head_dim]
    weights:
    - attn.wq_b.weight
    - attn.wq_b.scale
